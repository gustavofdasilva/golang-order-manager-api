services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - "${API_PORT}:${API_PORT}"
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      db:
        condition: service_healthy

  migrate:
    image: migrate/migrate:v4.18.3
    profiles: ["tools"]
    volumes:
      - ./migrations:/migrations
    command: >
      -path=/migrations
      -database postgres://${DB_USER}:${DB_PASS}@db:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSLMODE}
      up
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
